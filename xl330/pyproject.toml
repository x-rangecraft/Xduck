[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "xduck-xl330-unilab"
version = "0.1.0"
description = "Xduck XL330 official velocity task for UniLab 1.3.1"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "unilab[mujoco]==1.3.1",
  "unilab-rl==1.3.0",
  "unisim-core==1.7.3",
  "mjbatch-uni==0.2.1",
  "torch==2.8.0",
  "rsl-rl-lib==5.0.1",
  "tensordict==0.11.0",


  "huggingface_hub>=0.25",
]

[project.scripts]
xl330-train = "microduck_rl_unilab.cli:train_main"
xl330-eval = "microduck_rl_unilab.cli:eval_main"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
no-build-isolation-package = ["mujoco-uni-runtime"]
no-binary-package = ["mujoco-uni-runtime"]

[tool.uv.sources]
unilab = { git = "ssh://git@github.com/x-rangecraft/UniLab-private.git", rev = "447e5ce7ccb189a8b8e85fb4edb157e4bfbd1f78" }

[tool.pytest.ini_options]
markers = ["slow: real MuJoCo env build and step"]

[tool.uv.build-backend]
module-name = "microduck_rl_unilab"
