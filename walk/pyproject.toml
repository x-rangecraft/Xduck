[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "xduck-walk-latest"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy", "unilab[mujoco]==1.3.1", "unisim-core==1.7.3", "mjbatch-uni==0.2.1", "mujoco==3.11.0", "torch==2.8.0", "rsl-rl-lib==5.0.1", "tensordict==0.11.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xduck_walk_latest.gf43x40" = ["*.json"]

[project.entry-points."unilab.tasks"]
xduck_walk_latest = "xduck_walk_latest"

[tool.uv.sources]
unilab = { git = "ssh://git@github.com/x-rangecraft/UniLab-private.git", rev = "447e5ce7ccb189a8b8e85fb4edb157e4bfbd1f78" }

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8", "ruff"]
