      "weight": 2.0,
      "params": {
        "std": 0.35
      }
    },
    "action_rate_l2": {
      "func": "xduck_stand_latest.terms.handoff_action_rate_l2",
      "weight": -0.05
    },
    "foot_clearance": {
      "func": "xduck_walk_latest.rewards.foot_clearance",
      "weight": 0.0
