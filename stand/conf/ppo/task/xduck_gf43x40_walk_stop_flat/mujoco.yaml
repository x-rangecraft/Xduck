        "kp_multiplier_range": [
          0.8,
          1.2
        ],
        "kd_multiplier_range": [
          0.8,
          1.2
        ],
        "motor_dr_ranges": {
          "torque_scale_multiplier": [
            0.8,
            1.2
          ],
          "friction_scale_multiplier": [
            0.8,
            1.2
          ],
          "response_time_multiplier": [
            0.8,
            1.2
          ]
        }
      }
    },
    "commands": {
      "walk": {
        "_target_": "xduck_stand_latest.commands.XDuckStandCommandCfg",
        "resampling_time_range": [
          6.0,
          12.0
        ]
      }
    },
    "events": {
      "reset_scene": {
        "func": "unilab.envs.mdp.reset_scene_to_default",
        "mode": "reset"
      },
      "foot_friction": {
        "func": "unilab.envs.mdp.geom_friction",
        "mode": "reset",
        "params": {
          "ranges": [
            0.4,
            1.6
          ],
          "operation": "abs",
          "asset_cfg": {
            "_target_": "unilab.managers.scene_entity_config.SceneEntityCfg",
            "name": "robot",
            "geom_names": [
              ".*foot_collision"
            ]
          }
        }
      },
      "armature": {
        "func": "unilab.envs.mdp.joint_armature",
        "mode": "reset",
        "params": {
          "ranges": [
            0.8,
            1.2
          ],
          "operation": "scale",
          "asset_cfg": {
            "_target_": "unilab.managers.scene_entity_config.SceneEntityCfg",
            "name": "robot",
            "joint_names": [
              ".*"
            ]
          }
        }
      },
      "velocity_push": {
        "func": "unilab.envs.mdp.push_by_setting_velocity",
        "mode": "interval",
        "interval_range_s": [
          4.3370496884,
          8.6740993769
        ],
        "params": {
          "velocity_range": {
            "x": [
              -0.2,
              0.2
            ],
            "y": [
              -0.2,
              0.2
            ],
            "z": [
              0,
              0
            ],
            "roll": [
              0,
              0
            ],
            "pitch": [
              0,
              0
            ],
            "yaw": [
              0,
              0
            ]
          }
        }
      },
      "reset_walk_history": {
        "func": "xduck_walk_latest.task.reset_walk_history",
        "mode": "reset"
      },
      "handoff_reset": {
        "func": "xduck_stand_latest.terms.HandoffReset",
        "mode": "reset",
        "params": {
          "bank_path": "${oc.env:XDUCK_STAND_BANK}"
        }
      }
    },
    "terminations": {
      "time_out": {
        "func": "unilab.envs.mdp.time_out",
        "time_out": true
      },
      "stop_failure": {
        "func": "xduck_stand_latest.terms.stop_failure",
        "params": {
          "max_tilt_deg": 55.0,
          "min_height_ratio": 0.6
        }
      }
    },
    "metrics": {
      "stop_settled": {
        "func": "xduck_stand_latest.terms.SettledState",
        "params": {
          "linear_speed": 0.03,
          "angular_speed": 0.2,
          "joint_speed_rms": 0.15,
          "hold_seconds": 1.0,
          "contact_threshold": 0.1
        },
        "reduce": "last"
      }
    }
  },
  "training": {
    "task_name": "XDuckGF43X40WalkStopFlat",
    "sim_backend": "mujoco",
    "no_play": true
  },
  "algo": {
    "num_envs": 512,
    "num_steps_per_env": 48,
    "max_iterations": 25,
    "save_interval": 5,
    "empirical_normalization": true,
    "obs_groups": {
      "default": [
        "policy"
      ],
      "actor": [
        "actor"
      ],
      "critic": [
        "critic"
      ]
    },
    "policy": {
      "init_noise_std": 0.2,
      "actor_hidden_dims": [
        512,
        256,
        128
      ],
      "critic_hidden_dims": [
        512,
        256,
        128
      ],
      "activation": "elu",
      "class_name": "ActorCritic"
    }
  },
  "reward": {
