      "weight": 0.0
    },
    "dof_pos_limits": {
      "func": "xduck_walk_latest.rewards.dof_pos_limits",
      "weight": -1.0
    },
    "command_progress": {
      "func": "xduck_walk_latest.rewards.zero",
      "weight": 0.0
    }
  }
}
