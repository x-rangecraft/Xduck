# @package _global_
# Joint training candidate B; robot, GF and every env field remain inherited.
defaults:
  - /task/xduck_gf43x40_sitstand_training_coupled/mjwarp
  - _self_
algo:
  run_name: xduck_training_search_b
  num_steps_per_env: 48
  max_iterations: 100
  save_interval: 25
  algorithm:
    learning_rate: 0.0003
    num_learning_epochs: 5
    clip_param: 0.2
    entropy_coef: 0.001
reward:
  discovery_gate_positive_terms: true
  discovery_motion_cost_multiplier: 0.1
