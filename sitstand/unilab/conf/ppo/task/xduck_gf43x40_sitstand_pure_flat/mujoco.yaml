# @package _global_
# Pure PPO: train sitting down and standing up from the first iteration.
training:
  task_name: XDuckGF43X40SitStandPureFlat
  sim_backend: mujoco
  logger: tensorboard
  wandb_project: xduck_sitstand_pure
  play_steps: 1000
  play_env_num: 16
  no_play: true
  device: cpu
algo:
  seed: 1
  num_envs: 256
  num_steps_per_env: 96
  max_iterations: 100
  save_interval: 25
  empirical_normalization: true
  experiment_name: xduck_sitstand_pure
  run_name: pure_discovery
  obs_groups:
    actor:
    - actor
    critic:
    - critic
  policy:
    init_noise_std: 0.03
    actor_hidden_dims:
    - 512
    - 256
    - 128
    critic_hidden_dims:
    - 512
    - 256
    - 128
    activation: elu
    class_name: ActorCritic
  algorithm:
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.002
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.0001
    schedule: adaptive
    gamma: 0.995
    lam: 0.97
    desired_kl: 0.01
    max_grad_norm: 1.0
    class_name: unilab.training.checked_ppo:FiniteCheckedPPO
    disable_finite_checks: false
  resume: false
  actor:
    class_name: unilab.training.xduck_pure_actor:PureActor
    hidden_dims:
    - 512
    - 256
    - 128
    activation: elu
    obs_normalization: true
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 0.03
      std_type: scalar
  critic:
    class_name: rsl_rl.models.MLPModel
    hidden_dims:
    - 512
    - 256
    - 128
    activation: elu
    obs_normalization: true
env:
  pure_policy_revision: 2
  reference_keyframe: STAND
  sim_dt: 0.001
  ctrl_dt: 0.02
  max_episode_seconds: 12.0
  policy_action_scale_rad: 1.0
  posture_dwell_seconds:
  - 4.0
  - 6.0
  sit_reset_probability: 0.5
  sit_command_probability: 0.5
  posture_slew_seconds: 2.5
  sit_reset_height: 0.22
  stand_reset_height: 0.313459
  ankle_target_offset_max_deg: 3.0
  communication:
    jitter_mode: measured_20260918
    command_jitter_ms:
    - 0
    - 0
    feedback_jitter_ms:
    - 0
    - 0
    feedback_delay_ms: 0.0
    jitter_seed: 0
  control_config:
    action_scale: 1.0
    simulate_action_latency: false
    Kp: 90.0
    Kd: 2.5
    joint_kp:
    - 90
    - 90
    - 75
    - 100
    - 90
    - 75
    - 90
    - 75
    - 90
    - 90
    - 90
    - 75
    - 100
    - 90
    joint_kd:
    - 2.5
    - 2.5
    - 2.5
    - 3.0
    - 3.0
    - 2.5
    - 2.5
    - 2.5
    - 2.5
    - 2.5
    - 2.5
    - 2.5
    - 3.0
    - 3.0
  latency:
    actuator_delay_ms:
    - 0.0
    - 0.0
    imu_delay_ms:
    - 0.0
    - 20.0
    joint_velocity_delay_ms: 20.0
  noise_config:
    level: 2.0
    scale_joint_angle: 0.001
    scale_joint_vel: 0.17292861596651865
    scale_gyro: 0.020751433915982238
    scale_gravity: 0.01
    scale_linvel: 0.14456832294800961
  commands:
    velocity_low:
    - 0.0
    - 0.0
    - 0.0
    velocity_high:
    - 1.0
    - 0.0
    - 0.0
    resampling_time_range:
    - 3.5
    - 6.5
    rel_forward_envs: 0.0
    rel_turn_in_place_envs: 0.0
    forward_min_speed: 0.0
    head_resampling_time_range:
    - 2.9
    - 7.2
    body_resampling_time_range:
    - 2.9
    - 7.2
  domain_rand:
    randomize_base_mass: false
    random_com: false
    randomize_ground_friction: false
    randomize_foot_friction: true
    foot_friction_range:
    - 0.4
    - 1.6
    mass_inertia_scale_range:
    - 0.9
    - 1.1
    imu_max_angle_deg: 12.0
    randomize_dof_armature: true
    dof_armature_multiplier_range:
    - 0.9
    - 1.1
    randomize_kp: false
    randomize_kd: false
    randomize_joint_friction: false
    push_robots: false
    velocity_pushes: false
    velocity_push_interval_s:
    - 3.0
    - 6.0
    velocity_push_xy:
    - 0.0
    - 0.0
    push_body_name: base_link
    motor:
      enabled: false
  motor_envelope_mode: continuous_conservative
  whole_body_mass_dr: true
  dr_level: 0.0
  evaluation_case: -1
  reset_clearance_m: 0.0005
  nominal_env_fraction: 0.25
  case_weights:
  - 0.1
  - 0.1
  - 0.4
  - 0.4
reward:
  scales:
    ramp_height: 4.0
    goal_distance: -0.5
    pose_distance: -0.5
    task_progress: 2.0
    goal_composite: 5.0
    goal_stillness: 2.0
    transition_tilt: -0.2
    target_rate: -0.02
    torque_rate: 0.0
    descent_speed: -2.0
    rise_speed: 0.0
    impact: -0.1
    limit_proximity: -0.5
    forbidden_contact: -2.0
  stand_height: 0.3129
  sit_height: 0.2182
  height_std: 0.035
  pose_std: 0.3
  max_descent_speed: 0.08
  max_rise_speed: 0.16
  target_rate_std_rad_s: 5.0
  torque_rate_std_nm_s: 100.0
  progress_discount: 0.995
play_profile:
  enabled: true
  env:
    noise_config:
      level: 0.0
