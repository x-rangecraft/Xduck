# @package _global_
# XDuck-specific alignment of the official MicroDuck sit/stand recipe.
training:
  task_name: XDuckGF43X40SitStandAlignedFlat
  sim_backend: mujoco
  logger: tensorboard
  wandb_project: xduck_sitstand_aligned
  play_steps: 1000
  play_env_num: 16
algo:
  seed: 1
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 60000
  save_interval: 250
  empirical_normalization: true
  experiment_name: xduck_gf43x40_sitstand_aligned
  run_name: xduck_v112_gf_sitstand_aligned_v1
  obs_groups:
    actor: [actor]
    critic: [critic]
  policy:
    init_noise_std: 1.0
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
    activation: elu
    class_name: ActorCritic
  algorithm:
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.01
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.0005
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
env:
  reference_keyframe: STAND
  sim_dt: 0.001
  ctrl_dt: 0.02
  max_episode_seconds: 12.0
  policy_action_scale_rad: 0.5
  posture_dwell_seconds: [3.5, 6.5]
  sit_reset_probability: 0.5
  sit_command_probability: 0.5
  posture_slew_seconds: 2.0
  sit_reset_height: 0.22
  stand_reset_height: 0.313459
  ankle_target_offset_max_deg: 3.0
  communication:
    jitter_mode: measured_20260918
    command_jitter_ms: [0, 0]
    feedback_jitter_ms: [0, 0]
    feedback_delay_ms: 0.0
    jitter_seed: 0
  control_config:
    action_scale: 1.0
    simulate_action_latency: false
    Kp: 90.0
    Kd: 2.5
    # Policy joint order: left leg 5, head 4, right leg 5.
    joint_kp: [90, 90, 75, 100, 90, 75, 90, 75, 90, 90, 90, 75, 100, 90]
    joint_kd: [2.5, 2.5, 2.5, 3.0, 3.0, 2.5, 2.5, 2.5, 2.5, 2.5, 2.5, 2.5, 3.0, 3.0]
  latency:
    actuator_delay_ms: [0.0, 0.0]
    imu_delay_ms: [0.0, 20.0]
    joint_velocity_delay_ms: 20.0
  noise_config:
    level: 2.0
    scale_joint_angle: 0.001
    scale_joint_vel: 0.17292861596651865
    scale_gyro: 0.020751433915982238
    scale_gravity: 0.01
    scale_linvel: 0.14456832294800961
  commands:
    velocity_low: [0.0, 0.0, 0.0]
    velocity_high: [1.0, 0.0, 0.0]
    resampling_time_range: [3.5, 6.5]
    rel_forward_envs: 0.0
    rel_turn_in_place_envs: 0.0
    forward_min_speed: 0.0
    head_resampling_time_range: [2.9, 7.2]
    body_resampling_time_range: [2.9, 7.2]
  domain_rand:
    randomize_base_mass: false
    random_com: false
    randomize_ground_friction: false
    randomize_foot_friction: true
    foot_friction_range: [0.4, 1.6]
    mass_inertia_scale_range: [0.9, 1.1]
    imu_max_angle_deg: 12.0
    randomize_dof_armature: true
    dof_armature_multiplier_range: [0.9, 1.1]
    randomize_kp: false
    randomize_kd: false
    randomize_joint_friction: false
    push_robots: false
    velocity_pushes: false
    velocity_push_interval_s: [3.0, 6.0]
    velocity_push_xy: [0.0, 0.0]
    push_body_name: base_link
    motor:
      enabled: false
  curriculum:
    step_cap: null
    action_rate_stages:
      - {step: 0, value: -0.025}
      - {step: 48000, value: -0.05}
      - {step: 72000, value: -0.10}
      - {step: 96000, value: -0.15}
      - {step: 120000, value: -0.20}
      - {step: 144000, value: -0.25}
    descent_speed_stages:
      - {step: 0, value: -6.917144638660746}
      - {step: 48000, value: -13.834289277321492}
    rise_speed_stages:
      - {step: 0, value: 0.0}
      - {step: 144000, value: -3.458572319330373}
      - {step: 240000, value: -6.917144638660746}
reward:
  scales:
    posture_pose: 4.0
    posture_pose_l1: -1.3745583038869258
    posture_height: 1.0
    posture_height_sharp: 1.0
    posture_height_l1: -3.5
    posture_composite: 3.0
    rise_bootstrap: 0.518785847899556
    upright_linear: 2.5
    upright_while_tall: 1.5
    head_pose_tracking: 0.75
    posture_stillness: 2.0
    action_rate_l2: -0.025
    descent_speed: -6.917144638660746
    rise_speed: 0.0
    gentle_motion: -0.05
    body_ang_vel: -0.1045
    dof_pos_limits: -1.0
    self_collisions: -1.0
  sit_height: 0.2182
  stand_height: 0.3129
  pose_std: 0.4222222222222222
  pose_match_per_joint: true
  composite_pose_std: 0.4
  upright_from_tilt: true
  height_std: 0.06887272727272728
  sharp_height_std: 0.02582727272727273
  composite_height_std: 0.05165454545454546
  stillness_band_full: 0.020661818181818184
  stillness_band_zero: 0.05165454545454546
  upright_std: 0.4
  stillness_speed_std: 0.07228416147400481
  max_descent_speed: 0.07228416147400481
  max_rise_speed: 0.11565465835840769
play_profile:
  enabled: true
  env:
    noise_config:
      level: 0.0
