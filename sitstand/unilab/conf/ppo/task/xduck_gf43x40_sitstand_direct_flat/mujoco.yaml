# @package _global_
# 1024*24/1 = official 4096*24/4 = 24576 samples per minibatch.
# Four local iterations match one official iteration in fresh samples AND optimizer steps.
training:
  task_name: XDuckGF43X40SitStandDirectFlat
  sim_backend: mujoco
  no_play: true
  logger: tensorboard
  wandb_project: xduck_sitstand_direct
  play_steps: 1000
  play_env_num: 16
algo:
  seed: 1
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 60000
  save_interval: 250
  empirical_normalization: true
  experiment_name: xduck_gf43x40_sitstand_direct
  run_name: xduck_v112_gf_direct_v4
  obs_groups:
    actor:
    - actor
    critic:
    - critic
  policy:
    init_noise_std: 0.1
    actor_hidden_dims:
    - 512
    - 256
    - 128
    critic_hidden_dims:
    - 512
    - 256
    - 128
    activation: elu
    class_name: ActorCritic
  algorithm:
    class_name: unilab.training.checked_ppo:FiniteCheckedPPO
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.001
    num_learning_epochs: 5
    num_mini_batches: 1
    # RSL-RL 5 uses desired_kl adaptive LR; legacy target_kl_stop is stripped.
    learning_rate: 0.0001
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
