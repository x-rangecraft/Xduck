  reference_keyframe: STAND
  sim_dt: 0.001
  ctrl_dt: 0.02
  max_episode_seconds: 30
  policy_action_scale_rad: 1.0
  nominal_env_fraction: 0.25
  transition_success_reward: 4.0
  terminal_failure_cost: 8.0
  completion_hold_seconds: 0.5
