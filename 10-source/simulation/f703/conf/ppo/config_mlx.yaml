defaults:
  - _self_
  - task: go1_joystick_flat/mujoco

algo:
  algo: ppo
  algo_log_name: mlx_rl_train
  seed: 1
  num_envs: 4096
  num_steps_per_env: 24
  # Collect this many independent GAE segments before each PPO update.
  # Keeps the default behavior unchanged; memory-constrained tasks can trade
  # simultaneous environments for sequential batches without changing the
  # samples-per-update contract.
  rollout_batches: 1
  max_iterations: 101
  save_interval: 100
  empirical_normalization: false
  resume: false
  load_run: "-1"
  # When false, load only actor/critic weights and initialize fresh optimizer
  # state. Useful when a checkpoint seeds a different training objective.
  resume_trainer_state: true
  checkpoint: -1
  obs_groups:
    default:
      - policy
  policy:
    init_noise_std: 1.0
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
    activation: elu
    class_name: ActorCritic
  algorithm:
    class_name: PPO
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.01
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 1.0e-3
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    target_kl_stop: null
    max_grad_norm: 1.0
    adaptive_kl_beta: 0.9
    adaptive_lr_growth: 1.1
    adaptive_lr_decay: 1.2
    adaptive_lr_update_interval: 5
    metrics_interval: 8
    finite_check_interval: 8
    enable_compile: false
    warmup_strict_iters: 0
    warmup_metrics_interval: 1
    warmup_finite_check_interval: 1
    disable_finite_checks: true
    reward_normalization: false

training:
  task_name: Go1JoystickFlat
  device: mlx
  sim_backend: mujoco
  play_only: false
  no_play: false
  sim2sim_strict: true
  play_render_mode: auto
  play_env_num: 16
  play_steps: 150
  logger: tensorboard
  wandb_project: unilab
  wandb_entity: null
  wandb_group: null
  wandb_job_type: null
  wandb_name: null
  wandb_tags: []
  wandb_notes: null
  wandb_mode: null
  fp16: false
  seed: 1
  log_interval: 10
  save_interval: 50
  log_root: null

env:
  post_step_forward_sensor: false
  # adaptive_chunk_size: auto-tune the MuJoCo BatchEnvPool chunk_size at materialize
  # (cache-backed). chunk_size (int) manually overrides and wins; null => use default.
  adaptive_chunk_size: true
  chunk_size: null

interactive:
  action_mode: zero
  policy_obs_mode: auto
  show_target_bodies: false
  show_reward_debug: false
  target_show_axes: false
  target_body_names: ""
  target_max_bodies: 0
  target_marker_radius: 0.02
  target_axis_length: 0.08
  target_marker_alpha: 0.75
  reward_debug_show_velocity: false
  reward_debug_lin_vel_scale: 0.08
  reward_debug_ang_vel_scale: 0.05
  reward_debug_show_connectors: false
  reward_debug_show_global_anchor: false
  camera_follow_body: true
  camera_focus_body_name: ""
  camera_height_offset: 0.15
  camera_distance: null
  camera_elevation: null
  camera_azimuth: null
  use_env_visual_model: true
  speed: 1.0
  start_paused: false
  keyboard: false
  keyboard_step_lin: 0.1
  keyboard_step_ang: 0.2
  require_keyboard_command_obs: true

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
