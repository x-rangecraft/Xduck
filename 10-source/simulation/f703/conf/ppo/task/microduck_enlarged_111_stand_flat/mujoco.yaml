# @package _global_
defaults:
  - /task/microduck_enlarged_110_stand_flat/mujoco
  - _self_

training:
  task_name: MicroDuckEnlarged111StandFlat
  sim_backend: mujoco

algo:
  max_iterations: 151
  save_interval: 25
  algorithm:
    learning_rate: 2.0e-6

env:
  # Frequent HOME handovers during refinement. Acceptance still uses 30/60 s
  # no-autoreset rollouts; a short training timeout is not a stability claim.
  max_episode_seconds: 10.0

reward:
  # Measured joint pose, not actuator target: preserve gravity-compensation
  # offsets while pricing sustained departure from the supplied HOME.
  scales:
    leg_pose: 12.0
  # Official standing tolerances (radians), mirrored across both legs.
  leg_pose_stds: [0.1, 0.05, 0.15, 0.15, 0.1, 0.1, 0.05, 0.15, 0.15, 0.1]
  # Supplied V1.1.1 HOME base height with both sole sites on the flat floor.
  base_height_target: 0.313459
  # Translate the V110 admissible height window by the HOME origin shift.
  height_target_min: 0.268859
  height_target_max: 0.358859
  min_base_height: 0.198859
