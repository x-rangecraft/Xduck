# @package _global_
defaults:
  - /task/microduck_enlarged_112_walk_flat/mujoco_limits
  - _self_

# Continue the retained safe V1.1.2 baseline on the official simulator's
# basic remote-control pattern: stand, fore-aft travel and differential arcs.
# No strafe or turn-in-place command is sampled.  This profile changes the
# command curriculum only; plant, observations, actions and rewards stay fixed.
training:
  seed: 3311
  log_root: logs/v112_training/official_remote
  no_play: true
  save_interval: 50

algo:
  seed: 3311
  resume: true
  resume_trainer_state: false
  load_run: logs/v112_training/course_limits/MicroDuckEnlarged112WalkFlat/2026-09-21_15-00-52_mujoco/model_50.safetensors
  max_iterations: 601
  save_interval: 50
  algorithm:
    # A 5-iteration calibration measured KL 0.0646 at the inherited 3e-5;
    # 1e-5 reduced it to 0.0148 without changing the curriculum or rewards.
    learning_rate: 1.0e-5

env:
  command_mode_probabilities: []
  # stand / forward / backward / forward arc / backward arc
  remote_command_probabilities: [0.20, 0.25, 0.15, 0.25, 0.15]
  command_resample_interval_s: 3.0
  commands:
    vel_limit: [[-0.15, 0.0, -0.5], [0.30, 0.0, 0.5]]
