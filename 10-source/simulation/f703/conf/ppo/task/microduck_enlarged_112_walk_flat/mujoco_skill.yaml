# @package _global_
defaults:
  - /task/microduck_enlarged_112_walk_flat/mujoco
  - _self_

# Archived weak-smoothing ablation (not qualified); not used by the active
# limits -> lateral -> balanced curriculum. Kept for experiment provenance.
# Same seed, sampler, optimizer and plant as the prior steady-command run.
# External behavioral gates, not elapsed iterations, select the next lesson.
algo:
  max_iterations: 501
  policy:
    init_noise_std: 0.05
    resume_noise_std: 0.05
  algorithm:
    learning_rate: 3.0e-5
    entropy_coef: 0.0
env:
  command_mode_probabilities: [0.05, 0.35, 0.15, 0.15, 0.15, 0.15]
  command_resample_interval_s: 8.0
reward:
  action_rate_schedule_steps: [0]
  action_rate_schedule_scales: [-0.1]
  scales:
    action_rate: -0.1
