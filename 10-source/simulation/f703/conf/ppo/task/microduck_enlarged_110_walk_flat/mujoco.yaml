# @package _global_
defaults:
  - /task/microduck_enlarged_107_walk_flat/mujoco
  - _self_

training:
  task_name: MicroDuckEnlarged110WalkFlat
  sim_backend: mujoco
algo:
  policy:
    # Preserve the old 0.35 * 0.25 rad physical exploration amplitude.
    init_noise_std: 0.0875
    resume_noise_std: 0.0875
env:
  control_config:
    # Team-wide raw-action contract for hot-switch compatibility.
    action_scale: 1.0
    # Travel reserve before command delay and fitted motor response.
    joint_limit_margin_deg: 5.0
    joint_limit_lookahead_s: 0.25
