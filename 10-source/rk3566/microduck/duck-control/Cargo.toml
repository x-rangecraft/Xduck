[package]
name = "duck-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Robot control core: model, bus, sensing"

[dependencies]
# For `JOINT_NAMES` alone. The joint *order* is protocol — the state stream carries
# `joints` and `targets` as bare arrays — so the table lives in the crate every client
# already links, and this crate re-exports it rather than keeping a second copy in step by
# hand. Not a door onto IPC: nothing here speaks to a socket, and `robotd` already links
# both crates, so no binary gains a dependency from this edge.
duck-ipc-proto = { path = "../duck-ipc-proto" }
serde = { workspace = true }
thiserror.workspace = true
tracing.workspace = true

# `default-features = false` drops serialport's `libudev` feature, which exists only for
# enumerating ports (`available_ports`). We open one by path from the params file and never
# enumerate — and libudev-sys needs a pkg-config sysroot that the board's cross-build does
# not have, so leaving it on breaks the aarch64 build outright.
serialport = { version = "4.8", default-features = false }
