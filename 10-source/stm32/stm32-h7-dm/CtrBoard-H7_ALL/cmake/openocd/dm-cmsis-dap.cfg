adapter driver cmsis-dap
cmsis_dap_vid_pid 0x04d8 0x00df
transport select swd
adapter speed 4000

proc assert_stm32h7_dev_id {expected label} {
    set id [mrw 0x5C001000]
    set dev_id [expr {$id & 0xFFF}]
    if {$dev_id != $expected} {
        error [format "Refusing to program %s project: connected STM32H7 device id is 0x%03x, expected 0x%03x" $label $dev_id $expected]
    }
    echo [format "Verified %s target: DBGMCU_IDCODE=0x%08x" $label $id]
}
